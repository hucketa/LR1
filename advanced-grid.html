<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Grid</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/grid.css">
</head>

<body class="advanced-page">

    <header class="advanced-header">
        <h1>Advanced CSS Grid Features</h1>

        <p>
            Grid + Flexbox + Performance Optimization
        </p>
    </header>

    <section class="advanced-section">

        <h2>Grid + Flexbox Layout</h2>

        <div class="advanced-layout">

            <aside class="advanced-sidebar">

                <div class="logo">
                    GRID UI
                </div>

                <nav class="sidebar-menu">
                    <a href="#">Dashboard</a>
                    <a href="#">Analytics</a>
                    <a href="#">Projects</a>
                    <a href="#">Messages</a>
                    <a href="#">Settings</a>
                </nav>

            </aside>

            <main class="advanced-content">

                <div class="top-bar">

                    <h3>Admin Panel</h3>

                    <div class="user-box">

                        <span>Admin</span>

                        <img
                            src="images/grid-1.jpg"
                            alt="User"
                        >

                    </div>

                </div>

                <div class="cards-grid">

                    <div class="card card-large">

                        <div class="card-header">

                            <h3>Statistics</h3>

                            <span>2025</span>

                        </div>

                        <div class="card-body">

                            <div class="mini-stat">
                                <strong>24K</strong>
                                <span>Users</span>
                            </div>

                            <div class="mini-stat">
                                <strong>18K</strong>
                                <span>Sales</span>
                            </div>

                            <div class="mini-stat">
                                <strong>92%</strong>
                                <span>Growth</span>
                            </div>

                        </div>

                    </div>

                    <div class="card">
                        <h3>Users</h3>
                    </div>

                    <div class="card">
                        <h3>Orders</h3>
                    </div>

                    <div class="card">
                        <h3>Revenue</h3>
                    </div>

                    <div class="card card-wide">

                        <div class="card-header">

                            <h3>Analytics</h3>

                            <button class="export-btn">
                                Export
                            </button>

                        </div>

                        <div class="analytics-bars">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>

                    </div>

                </div>

            </main>

        </div>

    </section>

</body>
</html>
